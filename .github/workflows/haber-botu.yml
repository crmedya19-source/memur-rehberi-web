name: Haber botu

on:
  # schedule:
    # - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dene:
        description: "1 = sadece göster, kaydetme ve bildirim gönderme"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: haberler
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests google-auth
      - name: Haberleri tara
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          DENE: ${{ github.event.inputs.dene }}
        run: python .github/haber_botu.py
      - name: Kaydet
        if: ${{ github.event.inputs.dene != '1' }}
        run: |
          git config user.name "haber-botu"
          git config user.email "haber-botu@users.noreply.github.com"
          git add haberler.json .github/bot_durum.json
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "Haber botu: yeni başlıklar"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
