name: Haber bildirimi

on:
  push:
    branches: [ main ]
    paths: [ haberler.json ]
  schedule:
    # Güvence: 09:20 ve 20:20 (İstanbul) günün özeti bildirimi gitmiş mi, gitmediyse gönder
    - cron: "20 6,17 * * *"
  workflow_dispatch:
    inputs:
      baslik:
        description: "Bildirim başlığı (boş bırakırsan yeni haberlerden otomatik)"
        required: false
      metin:
        description: "Bildirim metni"
        required: false
      hedef:
        description: "Konu: haberler (herkes) ya da meslek_o, meslek_s ..."
        required: false
        default: haberler

permissions:
  contents: write

concurrency:
  group: bildirim
  cancel-in-progress: false

jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-auth requests
      - name: Bildirimi gönder
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          BASLIK: ${{ github.event.inputs.baslik }}
          METIN: ${{ github.event.inputs.metin }}
          HEDEF: ${{ github.event.inputs.hedef }}
          MOD: ${{ github.event_name == 'schedule' && 'kontrol' || '' }}
        run: python .github/bildirim.py
      - name: Gönderilenleri kaydet
        run: |
          git config user.name "haber-botu"
          git config user.email "haber-botu@users.noreply.github.com"
          git add .github/bildirim_kayit.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "kayıt değişmedi"; exit 0; fi
          git commit -q -m "Bildirim kaydı"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 7; done
