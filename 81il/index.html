<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>81 İl Kapışması</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta property="og:title" content="81 İl Kapışması"><meta property="og:description" content="Bil, saldır, Türkiye'yi fethet! Arkadaşlarınla çevrimiçi kapış."><meta property="og:image" content="https://crmedya19-source.github.io/memur-rehberi-web/81il/icon-512.png">
<style>
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#334155;--tx:#f1f5f9;--mut:#94a3b8;--ok:#22c55e;--bad:#ef4444;--acc:#facc15;--r:14px;--adh:0px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
html{-webkit-text-size-adjust:100%}
body.ingame{overflow:hidden;height:100%;overscroll-behavior:none}
body{padding-bottom:var(--adh)}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.scr{position:fixed;inset:0 0 var(--adh) 0;display:none;flex-direction:column;overflow:hidden}
.scr.on{display:flex}
.btn{background:var(--bg3);padding:12px 16px;border-radius:var(--r);font-weight:600}
.btn.p{background:linear-gradient(135deg,#2563eb,#7c3aed)}
.btn.y{background:var(--acc);color:#111}
.btn:disabled{opacity:.45}
.mut{color:var(--mut)}
/* ana menü */
#home{position:relative;inset:auto;min-height:100vh;min-height:100dvh;overflow:visible;padding:max(18px,env(safe-area-inset-top)) 18px calc(18px + var(--adh));gap:12px}
#home>*{flex-shrink:0}
.logo{text-align:center;margin:10px 0 2px}
.logo h1{margin:0;font-size:30px;letter-spacing:.5px;background:linear-gradient(90deg,#60a5fa,#a78bfa,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo .s{color:var(--mut);font-size:13px}
.prof{display:flex;align-items:center;gap:12px;background:var(--bg2);border-radius:var(--r);padding:12px}
.prof .lv{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#f59e0b,#ef4444);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px}
.bar{height:8px;background:var(--bg3);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#facc15)}
.dly{background:linear-gradient(135deg,#1e3a8a,#581c87);border:1px solid #fff2}
.dly h4{margin:0 0 4px;font-size:16px}.dly .act{margin-top:10px}
.em{font-size:18px;letter-spacing:1px;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--bg2);border-radius:var(--r);padding:12px}
.seg{display:flex;background:var(--bg3);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:none;padding:8px 4px;border-radius:9px;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--bg);color:var(--tx);font-weight:700}
.lbl{font-size:12px;color:var(--mut);margin:2px 0 6px}
/* oyun */
#game{background:var(--bg)}
.top{display:flex;gap:6px;padding:max(8px,env(safe-area-inset-top)) 8px 6px;align-items:stretch}
.pl{flex:1;background:var(--bg2);border-radius:10px;padding:5px 6px;border-bottom:4px solid;min-width:0;position:relative;transition:transform .2s}
.pl.cur{transform:translateY(2px);box-shadow:0 0 0 2px #fff6}
.pl.dead{opacity:.35}
.pl .n{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .c{font-weight:800;font-size:17px}
.pl .h{font-size:10px;letter-spacing:-1px}
.rnd{display:flex;justify-content:space-between;align-items:center;padding:0 10px 4px;font-size:12px;color:var(--mut)}
.mapw{flex:1;position:relative;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at center,#16233d,#0b1222);transition:height .25s}
#map{width:100%;height:100%;display:block}
#map path{stroke:#0b1222;stroke-width:.8;stroke-linejoin:round;transition:fill .35s}
#map path.tg{stroke:#fff;stroke-width:1.6;animation:pulse 1.2s infinite}
#map path.sel{stroke:#facc15;stroke-width:2.6}
#map path.flash{animation:fl .5s 3}
@keyframes pulse{50%{stroke-opacity:.35}}
@keyframes fl{50%{fill:#fff}}
#map text{pointer-events:none;font-weight:800;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#000a;stroke-width:2px}
.zb{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zb button{width:36px;height:36px;border-radius:10px;background:#1e293bd9;font-size:18px;font-weight:700}
.bot{background:var(--bg2);padding:10px 10px max(10px,env(safe-area-inset-bottom));border-radius:18px 18px 0 0}
#info{font-size:14px;min-height:20px;margin-bottom:8px}
#emoB{position:absolute;left:6px;bottom:6px;display:flex;gap:3px;z-index:3}#emoB[hidden]{display:none}#emoB button{background:rgba(15,23,42,.75);border:1px solid rgba(255,255,255,.15);border-radius:10px;font-size:18px;width:34px;height:34px;padding:0;cursor:pointer}#emoB button:active{transform:scale(.9)}
.chips{display:flex;flex-wrap:wrap;gap:6px;max-height:118px;overflow-y:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--bg3);padding:7px 10px;border-radius:20px;font-size:13px;display:flex;align-items:center;gap:6px;border:2px solid transparent}
.chip.on{border-color:var(--acc)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.act{display:flex;gap:8px;margin-top:4px}
.act .btn{flex:1}
/* katman */
.ov{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov.on{display:flex}
.box{background:var(--bg2);border-radius:20px;padding:16px;width:100%;max-width:440px;max-height:88vh;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;animation:pop .2s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.vs{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;font-size:13px}
.vs .p{flex:1;background:var(--bg3);border-radius:10px;padding:6px 8px;border-left:5px solid;display:flex;justify-content:space-between;align-items:center}
.vs b.st{font-size:16px}
.tag{display:inline-block;font-size:11px;background:var(--bg3);padding:2px 8px;border-radius:10px;color:var(--mut);margin-bottom:6px}
.qt{font-size:18px;font-weight:700;margin:4px 0 12px;line-height:1.35}
.tm{height:7px;background:var(--bg3);border-radius:5px;overflow:hidden;margin-bottom:12px}
.tm i{display:block;height:100%;background:var(--acc);transition:width .25s linear}
.op{display:block;width:100%;text-align:left;background:var(--bg3);padding:13px 14px;border-radius:12px;margin-bottom:8px;font-size:16px;font-weight:600;border:2px solid transparent}
.op.pick{border-color:var(--acc)}
.op.ok{background:#166534;border-color:var(--ok)}
.op.no{background:#7f1d1d;border-color:var(--bad)}
.op.gone{opacity:.15;pointer-events:none}
.jk{display:flex;gap:8px;margin-top:4px}
.jk button{flex:1;background:var(--bg);border-radius:10px;padding:8px 4px;font-size:12px;font-weight:700}
.jk button:disabled{opacity:.3}
.num{display:flex;gap:8px}
.num input{flex:1;background:var(--bg);border:2px solid var(--bg3);color:var(--tx);border-radius:12px;padding:12px;font-size:22px;font-weight:700;text-align:center;min-width:0}
.gl{display:flex;justify-content:space-between;padding:8px 10px;border-radius:10px;background:var(--bg3);margin-top:6px;border-left:5px solid}
.gl.w{outline:2px solid var(--acc)}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:95}
.shk{animation:shk .45s}
@keyframes shk{20%{transform:translate(-7px,3px)}40%{transform:translate(6px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
#vsOv{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:radial-gradient(circle,#1e1b4bee,#000e);pointer-events:none}
#vsOv.on{display:flex}
#vsOv .row{display:flex;align-items:center;gap:14px;width:100%;justify-content:center}
#vsOv .c{display:flex;flex-direction:column;align-items:center;gap:6px;width:38%;text-align:center}
#vsOv .c span{font-size:12px;color:var(--mut)}
#vsA{animation:inL .45s cubic-bezier(.2,1.4,.5,1)}#vsD{animation:inR .45s cubic-bezier(.2,1.4,.5,1)}
@keyframes inL{from{transform:translateX(-120%);opacity:0}}@keyframes inR{from{transform:translateX(120%);opacity:0}}
.av{width:74px;height:74px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:0 0 0 4px #fff3,0 0 30px #fff3}
#vsX{font-size:46px;font-weight:900;color:var(--acc);text-shadow:0 0 20px #facc15;animation:vx .6s .25s both}
@keyframes vx{from{transform:scale(3) rotate(-20deg);opacity:0}}
#vsT{font-size:22px;font-weight:800;text-align:center;animation:pop .4s .4s both}#vsT small{display:block;font-size:12px;color:var(--mut);font-weight:500}
#bnr{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);z-index:65;font-size:30px;font-weight:900;text-align:center;pointer-events:none;opacity:0;text-shadow:0 4px 20px #000;white-space:nowrap}
#bnr small{display:block;font-size:14px;font-weight:600;color:var(--mut)}
#bnr.on{animation:bn 1.5s}
@keyframes bn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-80%)}}
#intro{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 30%,#312e81,#0f172a);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:14px}
#intro.on{display:flex}
#intro h2{margin:0;font-size:22px}
.seats{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:380px}
.seat{background:#1e293bcc;border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;border:2px solid #fff1;opacity:.25;transition:.3s}
.seat.on{opacity:1;animation:pop .35s;border-color:var(--sc)}
.seat .av{width:60px;height:60px;font-size:32px}
.seat small{color:var(--mut);font-size:11px}
.dotl span{display:inline-block;animation:bl 1s infinite}.dotl span:nth-child(2){animation-delay:.2s}.dotl span:nth-child(3){animation-delay:.4s}
@keyframes bl{50%{opacity:.2}}
.op.ok{animation:okg .7s}
@keyframes okg{30%{transform:scale(1.04);box-shadow:0 0 24px #22c55e}}
.box.shk{animation:shk .45s}
.tm i.low{background:var(--bad)}
.op{transition:transform .1s}.op:active{transform:scale(.97)}
#lb{pointer-events:none;display:none}
#lb text{fill:#fff;font-weight:700;stroke:#0009;stroke-width:.25em;paint-order:stroke;text-anchor:middle}
#bubL{position:fixed;inset:0;pointer-events:none;z-index:66}
.bub{position:absolute;background:#fff;color:#111;font-size:12.5px;font-weight:600;padding:7px 10px;border-radius:12px;max-width:170px;box-shadow:0 6px 20px #0007;animation:bub 2.4s forwards;line-height:1.25}
.bub:before{content:"";position:absolute;top:-6px;left:var(--ax,20px);border:6px solid transparent;border-top:0;border-bottom-color:#fff}
@keyframes bub{0%{opacity:0;transform:translateY(-6px) scale(.8)}10%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0;transform:translateY(-4px)}}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw button{background:var(--bg3);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;border:2px solid transparent;color:var(--mut)}
.sw button.on{border-color:var(--acc);color:var(--tx)}
.sw button.lock{opacity:.35}
.sw .cc{width:34px;height:34px;border-radius:50%}
.sw .ae{font-size:30px;line-height:1}
#qRep{display:none;margin-top:6px;width:100%;background:none;color:var(--mut);font-size:12px;padding:6px}
#qRep.on{display:block}#qRep.mk{color:var(--acc)}
.rs label{display:flex;gap:8px;align-items:center;padding:9px;background:var(--bg3);border-radius:10px;margin-bottom:6px}
textarea{width:100%;background:var(--bg);color:var(--tx);border:2px solid var(--bg3);border-radius:10px;padding:8px;font:inherit;min-height:60px}
#toast{position:fixed;left:50%;top:max(118px,calc(env(safe-area-inset-top) + 110px));transform:translateX(-50%) translateY(-20px);background:#000e;padding:10px 16px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:80;max-width:92vw;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%)}
.rk{display:flex;align-items:center;gap:10px;padding:9px;border-radius:12px;background:var(--bg3);margin-bottom:6px;border-left:6px solid}
.rk .m{font-size:22px;width:30px;text-align:center}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg div{background:var(--bg3);border-radius:12px;padding:10px 6px;text-align:center;font-size:11px}
.bdg div.lock{opacity:.3;filter:grayscale(1)}
.bdg b{display:block;font-size:26px}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;background:var(--bg3);border-radius:12px;margin-bottom:6px}
.qrow.done{opacity:.55}
h3{margin:4px 0 10px}
.x{float:right;background:var(--bg3);width:32px;height:32px;border-radius:50%;font-weight:700}
.rw{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bg3)}
</style>
</head>
<body>

<!-- ANA MENÜ -->
<section id="home" class="scr on">
  <div class="logo"><h1>81 İl Kapışması</h1><div class="s">Bil, saldır, Türkiye'yi fethet</div></div>
  <div class="prof">
    <div class="lv" id="hLv">1</div>
    <div style="flex:1">
      <div style="display:flex;justify-content:space-between"><b id="hTitle">Çaylak</b><span class="mut" id="hXp" style="font-size:12px"></span></div>
      <div class="bar" style="margin-top:6px"><i id="hBar" style="width:0"></i></div>
      <div class="mut" style="font-size:12px;margin-top:4px">🃏 Joker: <b id="hJk">0</b> · 🔥 Seri: <b id="hStreak">0</b></div>
    </div>
  </div>
  <div class="card dly" id="dCard"></div>
  <div class="card">
    <div class="lbl">Bot seviyesi</div>
    <div class="seg" id="sDiff"><button data-v="0">Kolay</button><button data-v="1" class="on">Orta</button><button data-v="2">Zor</button></div>
    <div class="lbl" style="margin-top:10px">Maç uzunluğu</div>
    <div class="seg" id="sLen"><button data-v="8">Kısa · 8 tur</button><button data-v="12" class="on">Normal · 12</button><button data-v="18">Uzun · 18</button></div>
  </div>
  <button class="btn p" id="bPlay" style="font-size:18px;padding:16px">⚔️ Oyna</button>
  <button class="btn" id="bOnline" style="font-size:16px;padding:14px;background:linear-gradient(135deg,#0e7490,#1e3a8a)">🌐 Çevrimiçi oyna</button>
  <button class="btn" id="bSefer" style="font-size:16px;padding:14px;background:linear-gradient(135deg,#b45309,#7c2d12)">🏇 Sefer Modu <span id="sfP" style="font-weight:400;font-size:13px;opacity:.8"></span></button>
  <div class="grid2">
    <button class="btn" id="bQuest">🎯 Günlük görevler</button>
    <button class="btn" id="bBadge">🏅 Rozetler</button>
    <button class="btn" id="bStat">📊 İstatistik</button>
    <button class="btn" id="bHelp">❓ Nasıl oynanır</button>
  </div>
  <button class="btn" id="bLook">🎨 Görünüm</button>
  <button class="btn" id="bAdJ">🎬 Reklam izle → +1 joker</button>
  <button class="btn" id="bSet">⚙️ Ayarlar</button>
  <div class="mut" style="font-size:11px;text-align:center;margin-top:auto">İnternetsiz oynanır</div>
</section>

<!-- OYUN -->
<section id="game" class="scr">
  <div class="top" id="plBar"></div>
  <div class="rnd"><span id="rTxt">Tur 1/12</span><button id="bQuit" style="background:none;color:var(--mut);font-size:12px">✕ Çık</button></div>
  <div class="mapw" id="mapw">
    <svg id="map" xmlns="http://www.w3.org/2000/svg"><g id="mg"></g><g id="lb"></g><g id="mk"></g></svg>
    <canvas id="fx"></canvas>
    <div id="emoB" hidden><button data-e="👏">👏</button><button data-e="😂">😂</button><button data-e="😮">😮</button><button data-e="😡">😡</button><button data-e="👍">👍</button><button data-e="🔥">🔥</button></div>
    <div class="zb"><button id="zIn">+</button><button id="zOut">−</button><button id="zFit">⤢</button></div>
  </div>
  <div class="bot">
    <div id="info">Başkentini seç</div>
    <div class="chips" id="chips"></div>
    <div class="act"><button class="btn y" id="bAct" disabled>Seç</button></div>
  </div>
</section>

<!-- SORU -->
<div class="ov" id="qOv"><div class="box">
  <div class="vs" id="qVs"></div>
  <span class="tag" id="qTag"></span>
  <div class="qt" id="qTxt"></div>
  <div class="tm"><i id="qTm"></i></div>
  <div id="qOps"></div>
  <div class="jk" id="qJk">
    <button id="j50">½ Yarı yarıya</button><button id="jT">⏱ +10 sn</button><button id="jP">⏭ Pas</button>
  </div>
  <button id="qRep">⚑ Bu soruda hata var, bildir</button>
</div></div>

<!-- SAYISAL -->
<div class="ov" id="nOv"><div class="box">
  <span class="tag">⚖️ Berabere! Tahmin sorusu, en yakın kazanır</span>
  <div class="qt" id="nTxt"></div>
  <div class="tm"><i id="nTm"></i></div>
  <div id="nIn" class="num"><input id="nVal" inputmode="numeric" autocomplete="off" placeholder="Tahminin"><button class="btn y" id="nOk">Gönder</button></div>
  <div id="nRes"></div>
</div></div>

<!-- GENEL MODAL -->
<div class="ov" id="mOv"><div class="box" id="mBox"></div></div>
<div id="toast"></div>
<canvas id="cf"></canvas>
<div id="vsOv"><div class="row"><div class="c" id="vsA"></div><div id="vsX">VS</div><div class="c" id="vsD"></div></div><div id="vsT"></div></div>
<div id="bnr"></div>
<div id="bubL"></div>
<div id="intro"><h2 id="inH">Masa kuruluyor<span class="dotl"><span>.</span><span>.</span><span>.</span></span></h2><div class="seats" id="seats"></div><div class="mut" id="inS" style="font-size:13px"></div></div>

    $("qVs").innerHTML=vsHtml(A,D,m.ra?"✅":"❌",m.rd?"✅":"❌");
    if(s.mine){var ok=s.mine==="a"?m.ra:m.rd;G.st.ans++;P.ans++;if(ok){G.st.cor++;P.cor++;G.st.streak++;G.st.sbest=Math.max(G.st.sbest,G.st.streak);SND.ok();vib(30)}else{G.st.streak=0;SND.bad();vib([40,40,40])}}
    setTimeout(function(){close("qOv")},2000*(window.__FAST||1))},
  n:function(m){if(!G)return;var A=G.pl[m.a],D=G.pl[m.d],mine=m.a===G.me||m.d===G.me;ON.ns={m:m,mine:mine,sent:false};
    $("nTxt").textContent=m.tx+" ("+m.u+")";$("nVal").value="";$("nRes").innerHTML=mine?"":"<div class='mut' style='text-align:center'>👀 "+esc(A.n)+" ile "+esc(D.n)+" tahmin yapıyor…</div>";$("nIn").style.display=mine?"flex":"none";open("nOv");
    var left=m.dur,tot=m.dur;function upd(){$("nTm").style.width=Math.max(0,left/tot*100)+"%"}upd();clearInterval(ON.ntick);ON.ntick=setInterval(function(){left-=.25;upd();if(left<=0)clearInterval(ON.ntick)},250*(window.__FAST||1));
    $("nOk").onclick=function(){var s=ON.ns;if(!s||!s.mine||s.sent)return;var v=parseInt(String($("nVal").value).replace(/[^\d-]/g,""),10);if(isNaN(v)){toast("Bir sayı yaz");return}s.sent=true;$("nIn").style.display="none";$("nRes").innerHTML="<div class='mut' style='text-align:center'>🔒 Tahminin gönderildi: "+fmt(v)+"</div>";NET.sendIn(ON.code,{k:"num",v:v})};
    $("nVal").onkeydown=function(e){if(e.key==="Enter")$("nOk").onclick()}},
  nres:function(m){var s=ON.ns;if(!s)return;clearInterval(ON.ntick);var A=G.pl[s.m.a],D=G.pl[s.m.d];$("nIn").style.display="none";
    var rows=[[A,m.va,m.w],[D,m.vd,!m.w]];$("nRes").innerHTML="<div class='gl' style='border-color:var(--acc)'><span>Doğru cevap</span><b>"+fmt(m.v)+" "+esc(m.u)+"</b></div>"+rows.map(function(r){return "<div class='gl"+(r[2]?" w":"")+"' style='border-color:"+r[0].col+"'><span>"+esc(r[0].n)+(r[2]?" 🏆":"")+"</span><b>"+(r[1]==null?"—":fmt(r[1]))+"</b></div>"}).join("");
    if(s.mine){var iw=(s.m.a===G.me)===m.w;if(iw){SND.ok();G.st.num++}else SND.bad()}setTimeout(function(){close("nOv")},2200*(window.__FAST||1))},
  res:function(m){if(!G)return;var A=G.pl[m.a],D=G.pl[m.d],c=IL[m.t].c,me=G.me;
    if(m.w){if(m.cap){SND.boom();vib(120);FX.boom(c,A.col,1.8);shake();FX.float(c,"−1 🏰","#fde68a");if(m.el>=0){toast("🏰 "+IL[m.t].n+" düştü! "+G.pl[m.el].n+" elendi");if(m.a===me)G.st.caps++}else if(m.a===me)toast("💥 Başkente darbe vurdun!");else if(m.d===me)toast("💥 Başkentine darbe! Kalan kale: "+m.hp)}
      else{flash(m.t);SND.cap();FX.boom(c,A.col,1);FX.ring(c,A.col);FX.float(c,"+1",A.col);if(m.a===me){G.st.conq++;toast("✅ "+IL[m.t].n+" artık senin!")}if(m.d===me)toast("😱 "+IL[m.t].n+" ilini kaybettin")}}
    else{SND.shield();FX.shield(c,D.col);if(m.both&&(m.a===me||m.d===me))toast("🏰 İkiniz de bildiniz, kale dayandı!");else if(m.d===me){G.st.def++;toast("🛡️ "+IL[m.t].n+" ilini korudun!")}else if(m.a===me)toast("❌ "+IL[m.t].n+" alınamadı")}
    var el=$("p"+m.t);if(el)el.classList.remove("sel");if(m.a===me||m.d===me)setTimeout(function(){animVB(fitVB(),600)},900*(window.__FAST||1))},
  say:function(m){if(G&&G.pl[m.i]&&G.pl[m.i].bot)say(m.i,String(m.x).slice(0,80))},
  emo:function(m){if(!G||!G.pl[m.i]||EMOS.indexOf(m.e)<0)return;sayAny(m.i,m.e)},
  left:function(m){if(G&&G.pl[m.i])toast("📴 "+G.pl[m.i].n+" ayrıldı, yerine bot oynuyor")},
  end:function(m){if(!G)return;G.over=true;clearTg();close("qOv");close("nOv");clearInterval(ON.ttick);var me=G.me,place=m.rk.findIndex(function(r){return r.i===me})+1,mine=m.rk[place-1]||{c:0,al:false};
    var bonus=[150,80,40,10][place-1]||0,xp=G.st.cor*10+G.st.conq*15+G.st.caps*50+bonus+(place===1?40:0),l0=lvOf(P.xp);P.xp+=xp;P.games++;if(place===1)P.wins++;P.caps+=G.st.caps;P.conq+=G.st.conq;P.streakBest=Math.max(P.streakBest,G.st.sbest);P.online=(P.online||0)+1;if(place===1)P.onWins=(P.onWins||0)+1;saveP();checkBadges();
    if(place===1){SND.win();CF.burst(160,COL.concat(["#facc15","#fff"]))}var md=["🥇","🥈","🥉","4."];
    var h="<div class='mut' style='text-align:center'>🌐 Çevrimiçi maç · Oda "+esc(ON.code||"")+"</div><h3 style='text-align:center'>"+(place===1?"🎉 Kazandın!":"Maç bitti")+"</h3>"+
      m.rk.map(function(r,i){var p=G.pl[r.i];return "<div class='rk' style='border-color:"+p.col+"'><span class='m'>"+md[i]+"</span><span style='flex:1'>"+esc(p.n)+(r.i===me?" <b>(sen)</b>":"")+(r.al?"":" <span class='mut'>(elendi)</span>")+"</span><b>"+r.c+" il</b></div>"}).join("")+
      "<div class='card' style='margin-top:10px'><div class='rw'><span>Doğru cevap</span><b>"+G.st.cor+"/"+G.st.ans+"</b></div><div class='rw'><span>Fethedilen il</span><b>"+G.st.conq+"</b></div><div class='rw' style='border:0'><span>Kazanılan XP</span><b style='color:var(--acc)'>+"+xp+"</b></div></div>"+
      (lvOf(P.xp)>l0?"<p style='text-align:center;font-weight:700'>⬆️ Seviye atladın: "+lvOf(P.xp)+"</p>":"")+
      "<div class='act' style='margin-top:10px'><button class='btn' id='oHome'>Ana menü</button><button class='btn p' id='oAgain'>Yeni çevrimiçi maç</button></div><button class='btn' id='oShare' style='width:100%;margin-top:8px'>📤 Sonucu paylaş</button>";
    var code=ON.code;setTimeout(function(){$("bubL").innerHTML="";modal(h);$("oHome").onclick=function(){close("mOv");onLeave();goHome()};$("oAgain").onclick=function(){close("mOv");onLeave();goHome();onMenu()};
      $("oShare").onclick=function(){share("81 İl Kapışması'nda çevrimiçi maçta "+md[place-1]+" oldum! "+mine.c+" il aldım. Gel kapışalım: "+siteLink())}},900*(window.__FAST||1))}};
var EMOS=["👏","😂","😮","😡","👍","🔥"],emoLast=0;
$("emoB").onclick=function(e){var b=e.target.closest("button");if(!b||!ON.code||!NET)return;var n=Date.now();if(n-emoLast<1500)return;emoLast=n;NET.sendIn(ON.code,{k:"emo",e:b.dataset.e});b.style.transform="scale(1.3)";setTimeout(function(){b.style.transform=""},150)};
window.addEventListener("pagehide",function(){if(ON.code)onLeave()});
function sayAny(pi,txt){var p=G.pl[pi];var was=p.bot;p.bot=true;say(pi,txt);p.bot=was}
function siteLink(code){var u=location.origin+location.pathname;if(/^file:|claude/.test(location.href))u="https://crmedya19-source.github.io/memur-rehberi-web/81il/";return u+(code?"#oda="+code:"")}

/* ---------- lobi ---------- */
function onMenu(){if(!ONLINE_OK()){modal("<button class='x' data-x='mOv'>✕</button><h3>🌐 Çevrimiçi</h3><p>Çevrimiçi mod sunucu bağlantısı kurulunca açılacak. O zamana kadar botlara karşı, sefer modunda ya da günün haritasında oynayabilirsin.</p>");return}
  modal("<button class='x' data-x='mOv'>✕</button><h3>🌐 Çevrimiçi oyna</h3><div class='card' style='display:flex;align-items:center;gap:10px;margin-bottom:10px'><span style='font-size:30px'>"+myAv()+"</span><div style='flex:1'><div class='lbl'>Takma adın</div><b id='onNick'>"+esc(myNick())+"</b></div><button class='btn' id='onRe'>🎲</button></div>"+
    "<button class='btn p' id='onQuick' style='width:100%;margin-bottom:8px'>⚡ Hızlı maç</button><button class='btn' id='onNew' style='width:100%;margin-bottom:8px'>🏠 Arkadaşlarınla oda kur</button>"+
    "<div style='display:flex;gap:8px'><input id='onCode' maxlength='4' placeholder='Oda kodu' autocomplete='off' style='flex:1;background:var(--bg);color:var(--tx);border:2px solid var(--bg3);border-radius:12px;padding:10px;font-size:18px;text-transform:uppercase;letter-spacing:3px;text-align:center'><button class='btn y' id='onJoin'>Katıl</button></div>"+
    "<p class='mut' style='font-size:12px;margin-bottom:0'>Boş koltuklara 🤖 botlar oturur. Sohbet yoktur, sadece hazır emojilerle tepki verilir.</p>");
  $("onRe").onclick=function(){P.nick=newNick();saveP();$("onNick").textContent=P.nick};
  $("onNew").onclick=function(){onCreate(false)};$("onQuick").onclick=onQuick;
  $("onJoin").onclick=function(){var c=String($("onCode").value).toUpperCase().replace(/[^A-Z0-9]/g,"");if(c.length!==4){toast("4 haneli kodu yaz");return}onJoinCode(c)}}
function meObj(){return{n:myNick(),av:myAv(),j:Date.now()}}
function onBusy(t){modal("<h3>🌐 "+t+"</h3><p class='mut'>Bağlanıyor…</p>")}
function onNetErr(e){console.error(e);modal("<button class='x' data-x='mOv'>✕</button><h3>Bağlantı kurulamadı</h3><p>İnternet bağlantını kontrol edip tekrar dene.</p>")}
function onCreate(pub){onBusy(pub?"Hızlı maç":"Oda kuruluyor");netPick().init().then(function(){var tries=0;function go(){var c=rcode();return NET.createRoom(c,meObj(),pub).then(function(ok){if(ok)return c;if(++tries>5)throw new Error("kod");return go()})}return go()})
  .then(function(code){ON.code=code;ON.host=true;onAttach(code,pub)}).catch(onNetErr)}
function onJoinCode(code){onBusy("Odaya katılınıyor");netPick().init().then(function(){return NET.joinRoom(code,meObj())}).then(function(ok){if(!ok){modal("<button class='x' data-x='mOv'>✕</button><h3>Odaya girilemedi</h3><p>Oda dolu, maç başlamış ya da kod yanlış olabilir.</p><button class='btn' id='onBack' style='width:100%'>Geri</button>");$("onBack").onclick=onMenu;return}
  ON.code=code;ON.host=false;onAttach(code,false)}).catch(onNetErr)}
function onQuick(){onBusy("Rakip aranıyor");netPick().init().then(function(){return NET.listOpen()}).then(function(list){
  var tryJoin=function(i){if(i>=list.length){onCreate(true);return}NET.joinRoom(list[i],meObj()).then(function(ok){if(ok){ON.code=list[i];ON.host=false;onAttach(list[i],true)}else tryJoin(i+1)})};tryJoin(0)}).catch(onNetErr)}
function onAttach(code,pub){onCleanup();ON.started=false;
  ON.unsub.push(NET.onEv(code,onEvent));
  if(ON.host){ENG.code=code;ENG.E=null;ON.unsub.push(NET.onIn(code,function(u,m){ENG.inbox(u,m)}))}
  var qStart=Date.now();
  ON.unsub.push(NET.onRoom(code,function(r){ON.room=r;
    if(!r){if(ON.code===code&&!ON.host){onCleanup();ON.code=null;close("qOv");close("nOv");G=null;show("home");renderHome();modal("<button class='x' data-x='mOv'>✕</button><h3>Oda kapandı</h3><p>Odayı kuran oyuncu ayrıldı.</p>")}return}
    if(ON.host&&ENG.E){ENG.E.pl.forEach(function(p){if(p.uid&&p.conn&&!(r.p||{})[p.uid])ENG.drop(p.uid)})}
    if(!ON.started)onLobby(r,pub,qStart)}));
  if(pub&&ON.host){clearInterval(ON.qauto);ON.qauto=setInterval(function(){var r=ON.room;if(!r||ON.started||!ON.host){clearInterval(ON.qauto);return}var n=Object.keys(r.p||{}).length;if(n>=4||Date.now()-qStart>20000*(window.__FAST||1)){clearInterval(ON.qauto);onStart()}else if(!ON.started)onLobby(r,pub,qStart)},1000*(window.__FAST||1))}}
function onLobby(r,pub,qStart){if(!$("mOv").classList.contains("on")||!$("lobby"))modal("<div id='lobby'></div>");var ps=Object.keys(r.p||{}).map(function(u){return{u:u,m:safeMe(r.p[u])}}).sort(function(a,b){return a.m.j-b.m.j});
  var left=pub?Math.max(0,20-Math.floor((Date.now()-qStart)/1000/(window.__FAST||1))):0;
  $("lobby").innerHTML="<h3>"+(pub?"⚡ Hızlı maç":"🏠 Oda")+"</h3>"+(pub?"":"<div style='text-align:center;margin:6px 0 12px'><div class='lbl'>Oda kodu</div><div style='font-size:40px;font-weight:900;letter-spacing:8px;color:var(--acc)'>"+esc(ON.code)+"</div></div>")+
    [0,1,2,3].map(function(i){var x=ps[i];return "<div class='rk' style='border-color:"+COL[i]+"'><span class='m'>"+(x?x.m.av:"⌛")+"</span><span style='flex:1'>"+(x?esc(x.m.n)+(x.u===r.h?" 👑":"")+(x.u===NET.uid?" <b>(sen)</b>":""):"<span class='mut'>Bekleniyor… (boş kalırsa 🤖)</span>")+"</span></div>"}).join("")+
    (pub?"<p class='mut' style='text-align:center'>Rakip aranıyor… "+(ON.host?left+" sn sonra boş koltuklara bot oturur":"Kurucu maçı birazdan başlatacak")+"</p>":"<button class='btn' id='lInv' style='width:100%;margin:6px 0'>📤 Arkadaşını davet et</button>")+
    (ON.host?"<button class='btn y' id='lGo' style='width:100%;margin-top:6px'>▶ Maçı başlat"+(ps.length<4?" (boş koltuklara 🤖)":"")+"</button>":(pub?"":"<p class='mut' style='text-align:center'>Kurucu maçı başlatınca otomatik açılacak.</p>"))+
    "<button class='btn' id='lLeave' style='width:100%;margin-top:8px;background:var(--bad)'>Odadan çık</button>";
  if($("lInv"))$("lInv").onclick=function(){share("81 İl Kapışması'nda odama gel, kapışalım! ⚔️🇹🇷\nKod: "+ON.code+"\n"+siteLink(ON.code))};
  if($("lGo"))$("lGo").onclick=onStart;
  $("lLeave").onclick=function(){clearInterval(ON.qauto);onLeave();close("mOv")}}
function onStart(){var r=ON.room;if(!ON.host||!r||ON.started)return;ON.started=true;clearInterval(ON.qauto);NET.setStatus(ON.code,"play");ENG.start(ON.code,r)}
function onDeepLink(){var m=String(location.hash).match(/oda=([A-Z0-9]{4})/i);if(m&&ONLINE_OK()){history.replaceState(null,"",location.pathname+location.search);setTimeout(function(){onJoinCode(m[1].toUpperCase())},300)}}

$("bOnline").onclick=onMenu;
FX.init();renderHome();packLoad();onDeepLink();window.addEventListener("hashchange",onDeepLink);
</script>
